[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ken109/linear"
publish = false

[workspace.dependencies]
linear-core = { path = "crates/core" }
cynic = "3.14"
cynic-codegen = "3.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
schemars = { version = "1", features = ["chrono04"] }

# Size-oriented profile for the wasm artifact only (the CLI keeps the default release profile).
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
