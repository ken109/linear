[package]
name = "linear"
description = "A command-line client for Linear."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "linear"
path = "src/main.rs"

[dependencies]
linear-core.workspace = true
serde.workspace = true
serde_json.workspace = true
cynic.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ureq = "3"
toml_edit = "0.22"
rpassword = "7"
# Random bytes for the OAuth state and PKCE verifier. Already in the tree through ring (rustls).
getrandom = "0.2"

# The OS keyring (`credential_store = "keyring"`). Optional: build with
# `--no-default-features` for a binary that only knows the credentials file. macOS uses
# the Keychain through the `keyring` crate (one extra crate, security-framework). Linux
# needs no dependency at all: it calls libsecret's `secret-tool` when that is installed.
# Elsewhere (and wherever there is no keyring) the file is used.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"], optional = true }

[features]
default = ["keyring"]
keyring = ["dep:keyring"]

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"
