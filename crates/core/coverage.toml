# Coverage manifest: how the CLI relates to Linear's GraphQL schema.
#
# `crates/core/tests/coverage.rs` checks this file against `schema/linear.graphql`
# (and against the code). It fails when
#
#   * a field of the Query, Mutation or Subscription root, or of one of the core
#     entities (Issue, Project, ProjectMilestone, ProjectUpdate, Initiative, User,
#     Template, Team, IssueLabel, Comment, Attachment), is not classified here;
#   * a classified field no longer exists in the schema;
#   * a field is classified twice;
#   * the classification disagrees with what the code actually selects.
#
# Each `[[entry]]` classifies a list of fields of one GraphQL type:
#
#   status = "implemented"   `via` names the item in `linear-core` that implements it
#                            (`queries::<fn>`, `inputs::<fn>` or `types::<Struct>`; the
#                            test checks it exists). `commands` lists the CLI commands
#                            that expose it (free text; empty until a command exists).
#   status = "unsupported"   `reason` says why. Use "planned" wording only for things
#                            that are on the roadmap; everything is reachable for reads
#                            through `linear api`.
#
# For the root types a field is "implemented" when a typed query or mutation selects
# it. For the core entities, "implemented" means the entity's `--json` output includes
# it (the fixed fragment in `types.rs`), and "unsupported" means it is left out.
#
# When the schema changes (scripts/update-schema.sh, run weekly by CI) and the test
# lists new fields, add them to an existing entry or start a new one.


