[package]
name = "linear-wasm"
description = "Thin JSON-in/JSON-out wrapper around linear-core for use from a Worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
linear-core.workspace = true
wasm-bindgen = "0.2"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
schemars.workspace = true

[features]
# Exports `probe_panic` and `probe_fine`, to check how a panic looks from
# JavaScript (the package's panic test builds with it). Never in a release.
panic-probe = []
