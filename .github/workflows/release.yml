name: Release

# Called by release-please.yml once its release PR is merged: it passes the tag
# (vX.Y.Z) that release-please just created. This workflow then builds the `linear`
# binary for macOS (arm64, x86_64) and Linux (x86_64, static musl), builds the wasm npm
# tarball, attaches all of them with their checksums to the GitHub Release that
# release-please already created, and commits a regenerated Formula/linear.rb to the
# Homebrew tap ken109/homebrew-tap.
#
# There is deliberately no `push: tags` trigger. release-please creates the tag with the
# default GITHUB_TOKEN, which does not start workflows, so a tag trigger would never
# fire for it; and if one did fire (a tag pushed by hand) it would race the call.
#
# The tag must equal the workspace version in Cargo.toml and the version in
# packages/linear-wasm/package.json at the tag; the workflow fails otherwise and bumps
# nothing. Every job builds from the tag, not from the branch head.
#
# workflow_dispatch with dry_run (the default) runs the whole build and packaging from
# the selected branch and uploads everything, the formula included, to the run, but
# creates no Release and does not touch the tap.
#
# Secret: TAP_GITHUB_TOKEN, a token that can push to ken109/homebrew-tap (passed to the
# call with `secrets: inherit`).

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and publish, for example v0.1.0
        type: string
        required: true
      dry_run:
        description: Build and package only; create no Release and do not touch the tap
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package only; create no Release and do not touch the tap
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - id: v
        env:
          TAG: ${{ inputs.tag }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ -n "$TAG" ]; then
            # Called with a tag: the checkout is that tag, and it must match the versions.
            version=$(sh scripts/release/check-version.sh "$TAG")
            dry_run=${DRY_RUN_INPUT:-false}
          else
            # A manual run has no tag: check the two versions agree and use that version.
            version=$(sh scripts/release/check-version.sh)
            dry_run=${DRY_RUN_INPUT:-true}
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "dry_run=$dry_run"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, dry_run $dry_run, prerelease $prerelease"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest # cross-compiled on the arm64 runner
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CARGO_PROFILE_RELEASE_STRIP: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked -p linear --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          bin=target/${{ matrix.target }}/release/linear
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ]; then
            run="arch -x86_64 $bin"
          else
            run=$bin
          fi
          out=$($run --version)
          echo "$out"
          [ "$out" = "linear $VERSION" ] || { echo "expected 'linear $VERSION'" >&2; exit 1; }
      - name: Package
        run: sh scripts/release/package.sh "$VERSION" "${{ matrix.target }}" "target/${{ matrix.target }}/release/linear" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linear-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  wasm:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/linear-wasm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # wasm-bindgen-cli must be the version of the wasm-bindgen crate in Cargo.lock.
      - name: Find the wasm-bindgen version
        id: bindgen
        working-directory: .
        run: |
          version=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="wasm-bindgen") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: bindgen-cache
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.bindgen.outputs.version }}
      - name: Install wasm-bindgen-cli
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.bindgen.outputs.version }}" --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/linear-wasm/package-lock.json
      - run: npm ci
      - run: sh scripts/build.sh
      - run: sh scripts/pack.sh
      - name: Tarball is named after the release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls out
          [ -f "out/ken109-linear-wasm-$VERSION.tgz" ] || { echo "expected out/ken109-linear-wasm-$VERSION.tgz" >&2; exit 1; }
      - name: Checksum
        working-directory: packages/linear-wasm/out
        run: sha256sum *.tgz > "$(ls *.tgz).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: linear-wasm
          path: |
            packages/linear-wasm/out/*.tgz
            packages/linear-wasm/out/*.sha256
          if-no-files-found: error

  formula:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: linear-*-*
          path: dist
          merge-multiple: true
      - name: Generate the formula
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          sha() { cut -d' ' -f1 "dist/linear-$VERSION-$1.tar.gz.sha256"; }
          mkdir -p formula
          sh scripts/release/formula.sh "$VERSION" \
            "$(sha aarch64-apple-darwin)" \
            "$(sha x86_64-apple-darwin)" \
            "$(sha x86_64-unknown-linux-musl)" \
            formula/linear.rb
          cat formula/linear.rb
      - uses: actions/upload-artifact@v4
        with:
          name: formula
          path: formula/linear.rb
          if-no-files-found: error

  release:
    needs: [version, build, wasm, formula]
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: linear-*
          path: dist
          merge-multiple: true
      - name: Attach the files to the release
        run: |
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The normal path: release-please created the Release and its notes when it
            # tagged. Also a re-run of a failed release: replace the assets.
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # Fallback when no Release exists for the tag (a manual re-run, or a Release
            # that was deleted): create it here with generated notes.
            flags=""
            [ "$PRERELEASE" = true ] && flags="--prerelease"
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$TAG" --generate-notes $flags
          fi

  tap:
    # After the release, because the formula points at its assets. Pre-releases are not
    # offered through brew.
    needs: [version, release]
    if: needs.version.outputs.dry_run != 'true' && needs.version.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: formula
          path: formula
      - uses: actions/checkout@v4
        with:
          repository: ken109/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
      - name: Commit the formula
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../formula/linear.rb Formula/linear.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/linear.rb
          if git diff --cached --quiet; then
            echo "Formula/linear.rb is already up to date"
          else
            git commit -m "linear $VERSION"
            git push
          fi
